<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161d">
  <meta name="description" content="A retro pixel-art football career game for mobile. Create a player, get drafted, and chase the Hall of Fame.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixel Gridiron">
  <title>Pixel Gridiron: Career Mode</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="ui"></div>
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="ov" class="overlay"></div>
    <div id="rotate"><div>ROTATE YOUR DEVICE</div><div class="tiny">Pixel Gridiron plays in landscape</div></div>
  </div>
  <div id="modal"></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/league.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/season.js"></script>
  <script src="js/career.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/plays.js"></script>
  <script src="js/input.js"></script>
  <script src="js/field.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/drills.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/match.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
